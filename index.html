<!DOCTYPE html>
<!--
  Hyginix — Equipment Desk, home-screen front door.

  The app itself is a Google Apps Script web app (repo Hyginix/hyginix-equipment-system).
  Apps Script cannot give iOS a home-screen icon, so this page exists only to
  carry the icon and the app name, and shows the real app full screen inside.
  No data and no logic live here. ?test opens the SANDBOX copy instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006177">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equipment">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Equipment Desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F9FB; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: #F8F9FB; transition: opacity .3s; }
  #wait img { width: 96px; height: 96px; border-radius: 22px; animation: pulse 1.4s ease-in-out infinite; }
  #wait.gone { opacity: 0; pointer-events: none; }
  @keyframes pulse { 50% { opacity: .55; transform: scale(.94); } }
</style>
</head>
<body>
<div id="wait"><img src="apple-touch-icon.png" alt="Equipment Desk"></div>
<script>
  var APP = {
    real: 'https://script.google.com/macros/s/AKfycbyku5YA5pRPny7O0rXcvXuZmQ5T8JxDcSx-CTHrXLaQ-hgfu1Xxhz6UCxUnOP-BqQq6/exec',
    test: 'https://script.google.com/macros/s/AKfycbwHTMnnbXvvEPSp-3tareDZMZho3fCCB_g4mDobKRWwEJPlnnvGIGdj-hBQkOvc_qHLfQ/exec'
  };
  var f = document.createElement('iframe');
  f.src = /[?&]test\b/.test(location.search) ? APP.test : APP.real;
  f.title = 'Equipment Desk';
  f.allow = 'camera; clipboard-write';
  f.onload = function () { document.getElementById('wait').className = 'gone'; };
  document.body.appendChild(f);
</script>
</body>
</html>
